[tool.poetry]
name = "Midas"
version = "0.1.0"
description = "Прогнозирование акций с помощью Prophet и оптимизация Марковица"
authors = ["Mifestos"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^1.24.0"
pandas = "^2.0.0"
yfinance = "^0.2.28"
prophet = "^1.1.5"
scipy = "^1.11.4"
matplotlib = "^3.8.2"
streamlit = "^1.29.0"
plotly = "^5.18.0"
requests = "^2.31.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
